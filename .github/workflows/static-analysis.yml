name: Static Analysis

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  analyse:
    name: Lint and PHPStan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          # Lint on the oldest version the plugin claims to support, so we do
          # not accidentally ship syntax that breaks on a customer's host.
          php-version: '7.4'
          coverage: none
          tools: none

      - name: Version agrees with itself
        run: php tools/check-version.php

      - name: Syntax check (php -l)
        run: php tools/lint.php

      - name: Admin view markup
        run: php tools/check-views.php

      - name: Format strings
        run: php tools/check-formats.php

      - name: Menu and tabs agree
        run: php tools/check-tabs.php

      - name: Free limit gates
        run: php tools/check-limit-gates.php

      # A lost add_action produces no fatal, no warning and no log line - stock
      # just stops flowing to eBay. This is the only thing that would notice.
      - name: Hook registrations intact
        run: php tools/check-hooks.php

      # Needs a committed tree, which is exactly what CI has and a working
      # copy usually does not. Compares what auto-updating sites receive
      # against what the uploaded zip contains.
      - name: Distribution routes agree
        run: php tools/check-archive-parity.php

      # PHPStan itself needs a modern PHP; the analysis still targets 7.4 via
      # the platform setting in composer.json.
      - name: Set up PHP for analysis
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: PHPStan
        run: php vendor/phpstan/phpstan/phpstan.phar analyse --memory-limit=3G --no-progress --error-format=github
